<!DOCTYPE html>
<html lang="id">
<head>
  <script src="/js/theme.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Profile - TarikCerdas</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <div class="edit-profile-wrapper">
    <div class="edit-profile-container">
      
      <!-- Header -->
      <div class="edit-profile-header">
        <h1>Edit Profile</h1>
        <p>Ubah dan perbarui informasi akun Anda</p>
      </div>

      <!-- Avatar Section dengan Tombol Upload -->
      <div class="avatar-upload-section">
        <div class="avatar-preview-box">
          <img src="https://img.icons8.com/bubbles/200/user-female-circle.png" id="avatarImage" alt="Avatar User">
          <label for="avatarInput" class="avatar-edit-overlay" title="Ubah Foto Profil">
            <i class="bi bi-camera-fill"></i>
          </label>
          <input type="file" id="avatarInput" accept="image/*" style="display: none;">
        </div>
        <p class="avatar-hint">Klik ikon kamera untuk mengganti foto</p>
      </div>

      <!-- Form Inputs -->
      <form id="editProfileForm">
        
        <!-- Field Username -->
        <div class="form-group-profile">
          <label for="usernameInput">Nama Pengguna (Username)</label>
          <div class="input-icon-wrapper">
            <i class="bi bi-person-fill input-icon"></i>
            <input type="text" id="usernameInput" placeholder="Masukkan nama pengguna baru" required>
          </div>
        </div>

        <!-- Field Email -->
        <div class="form-group-profile">
          <label for="emailInput">Alamat Email</label>
          <div class="input-icon-wrapper">
            <i class="bi bi-envelope-fill input-icon"></i>
            <input type="email" id="emailInput" placeholder="Masukkan email Anda" required>
          </div>
        </div>

        <!-- Field Password -->
        <div class="form-group-profile">
          <label for="passwordInput">Kata Sandi Baru</label>
          <div class="input-icon-wrapper">
            <i class="bi bi-lock-fill input-icon"></i>
            <input type="password" id="passwordInput" placeholder="Kosongkan jika tidak ingin mengubah">
            <button type="button" class="btn-toggle-password" id="togglePassword">
              <i class="bi bi-eye-slash-fill"></i>
            </button>
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="profile-actions-row">
          <a href="/dashboard" class="btn-back-profile">
            <i class="bi bi-arrow-left"></i> Kembali ke Dashboard
          </a>
          <button type="submit" class="btn-save-profile">
            <i class="bi bi-check-circle-fill"></i> Simpan Perubahan
          </button>
        </div>

      </form>

    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const avatarInput = document.getElementById('avatarInput');
      const avatarImage = document.getElementById('avatarImage');
      const usernameInput = document.getElementById('usernameInput');
      const emailInput = document.getElementById('emailInput');
      const passwordInput = document.getElementById('passwordInput');
      const togglePassword = document.getElementById('togglePassword');
      const form = document.getElementById('editProfileForm');

      // 1. Ambil data profil dari localStorage saat pertama kali dibuka
      const defaultUser = {
        username: 'akudhila',
        email: 'ardhilawulan@gmail.com',
        avatar: 'https://img.icons8.com/bubbles/200/user-female-circle.png'
      };

      const savedUser = JSON.parse(localStorage.getItem('userProfile')) || defaultUser;

      usernameInput.value = savedUser.username || '';
      emailInput.value = savedUser.email || '';
      if (savedUser.avatar) {
        avatarImage.src = savedUser.avatar;
      }

      let currentAvatarData = savedUser.avatar;

      // 2. Tampilkan preview foto dan konversi ke Base64 saat diunggah
      avatarInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
          // Validasi ukuran foto (maksimal 2MB)
          if (file.size > 2 * 1024 * 1024) {
            alert('Ukuran gambar terlalu besar! Pilih foto di bawah 2MB.');
            avatarInput.value = '';
            return;
          }

          const reader = new FileReader();
          reader.onload = function(evt) {
            currentAvatarData = evt.target.result;
            avatarImage.src = currentAvatarData;
          };
          reader.readAsDataURL(file);
        }
      });

      // 3. Toggle password visibility
      togglePassword.addEventListener('click', function() {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        
        const icon = this.querySelector('i');
        icon.classList.toggle('bi-eye-fill');
        icon.classList.toggle('bi-eye-slash-fill');
      });

      // 4. Simpan perubahan ke localStorage
      form.addEventListener('submit', function(e) {
        e.preventDefault();

        const updatedUsername = usernameInput.value.trim();
        const updatedEmail = emailInput.value.trim();
        const updatedPassword = passwordInput.value.trim();

        if (!updatedUsername || !updatedEmail) {
          alert('Nama pengguna dan email tidak boleh kosong!');
          return;
        }

        const updatedProfile = {
          username: updatedUsername,
          email: updatedEmail,
          avatar: currentAvatarData
        };

        if (updatedPassword !== '') {
          updatedProfile.password = updatedPassword;
        } else if (savedUser.password) {
          updatedProfile.password = savedUser.password;
        }

        // Simpan permanen di browser
        localStorage.setItem('userProfile', JSON.stringify(updatedProfile));

        alert('Profil berhasil diperbarui!');
        window.location.href = '/dashboard';
      });
    });
  </script>

</body>
</html>
